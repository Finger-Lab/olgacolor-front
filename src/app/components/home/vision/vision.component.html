<div id="vision">
    <div>
        <div class="container">
            <app-dividing-line [width]="dynamicWidth()" [bg]="dynamicBg()" />

            <div class="row">
                <div class="col-lg-10">
                    <h2 data-aos="flip-up" data-aos-delay="300">
                        <strong>Qualidade</strong> é o nosso <strong>perfil</strong>.
                    </h2>
               </div>
            </div>
            <div>
            <img class="img-fluid" src="assets/images/home/Selos.png" alt="Selos da visão">
            </div>
        </div>
    </div>
    <div>
        <video autoplay [muted]="'muted'" loop>
            <source src="assets/videos/home/vision.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
    </div>
</div>
