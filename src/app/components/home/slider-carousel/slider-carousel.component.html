<div id="slider-carousel">
    <div class="container">
        <div class="container-carousel">
            <div class="list-carousel">
                @if (loading()) {
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <p>Carregando obras...</p>
                    </div>
                }
                @else {
                    @for (item of displayItems(); track $index) {
                        <div class="item-carousel" (click)="navigateToObra(item)" [class.clickable]="!!item.id">
                            <img 
                                [src]="item.src" 
                                [alt]="item.title || 'Obra da Olgacolor'"
                                (error)="onCarouselImageError($event)">

                            <div>
                                <p>{{ item.title }}</p>
                                <span>{{ item.subtitle }}</span>
                            </div>
                        </div>
                    }
                }                
            </div>            
        </div>

        <button class="prev" (click)="moveSlide(-1)">&#10094;</button>
        <button class="next" (click)="moveSlide(1)">&#10095;</button>
    </div>
</div>
