<div id="login">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-lg-6">
                <div class="content-bg">

                </div>

                <div class="content-login">
                    <h3>Login</h3>
                    
                    <form [formGroup]="formAuth">
                        <div class="form-group mt-5">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" formControlName="email" placeholder="Digite seu email">
                        </div>

                        <div class="form-group mt-3 mb-2">
                            <label for="password">Senha</label>
                            <input type="password" class="form-control" id="password" formControlName="password" placeholder="Digite sua senha">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <button type="button"
                                    class="btn btn-link px-0"
                                    style="font-size: 0.85rem;"
                                    (click)="onForgotPassword()"
                                    [disabled]="isSendingReset">
                                {{ isSendingReset ? 'Enviando...' : 'Esqueci minha senha' }}
                            </button>

                            <span (click)="goToRegister()" style="cursor: pointer; font-size: 0.8rem;">
                                Não possui conta? Cadastre-se
                            </span>
                        </div>
                    </form> 
                    
                    <button class="btn btn-outline-dark d-table w-100 mt-5" 
                            [disabled]="formAuth.invalid || isLoading"
                            (click)="login()">
                        {{ isLoading ? 'Entrando...' : 'Entrar' }}
                    </button>

                    <div class="auth-footer text-center mt-3" style="text-align:center; margin-top:1rem;">
                        <p>Sistema de Autenticação Olgacolor</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
