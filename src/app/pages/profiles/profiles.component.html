<div id="profiles">
    <app-header [customClass]="classScrolled" />
    
    <!-- Custom drawer overlay -->
    <div class="custom-drawer-overlay" [class.open]="profilesService.selectedProduct()" (click)="closeModal()"></div>
    
    <!-- Custom drawer -->
    <div class="custom-drawer" [class.open]="profilesService.selectedProduct()">
        <div class="product">
            <button class="close-btn" (click)="closeModal()">
                <span>&times;</span>
            </button>
            
            <div class="product-content">
                <img [src]="profilesService.selectedProduct()?.images?.[1] || profilesService.selectedProduct()?.images?.[0]"
                    [alt]="profilesService.selectedProduct()?.name" />
                
                <div class="product-info">
                    <h3 class="product-title">{{ profilesService.selectedProduct()?.name }}</h3>
                    
                    <div class="product-details">
                        <div class="detail-item">
                            <small>Descrição</small>
                            <p>{{ profilesService.selectedProduct()?.description || '-' }}</p>
                        </div>

                        <div class="detail-row">
                            <div class="detail-item">
                                <small>Peso</small>
                                <p>{{ profilesService.selectedProduct()?.weight || '-' }}</p>
                            </div>
                            <div class="detail-item">
                                <small>Equivalência</small>
                                <p>{{ profilesService.selectedProduct()?.equivalence || '-' }}</p>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button (click)="openImage(profilesService.selectedProduct()?.['tableImageSrc'])" 
                                [style]="profilesService.selectedProduct()?.['isTable'] ? 'visibility:visible' : 'visibility:hidden'"  
                                class="btn btn-primary btn-sm">
                            Ver tabela
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <router-outlet name="second" />
    <app-footer />
</div>
