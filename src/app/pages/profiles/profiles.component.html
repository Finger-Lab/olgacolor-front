<div id="profiles">
    <app-header [customClass]="classScrolled" />
    
    <!-- Modal Overlay -->
    <div class="modal-overlay" 
         [class.open]="profilesService.selectedProduct()" 
         (click)="closeModal()"></div>
    
    <!-- Modal Centralizado -->
    <div class="profile-modal" [class.open]="profilesService.selectedProduct()">
        <div class="modal-content-wrapper">
            <button class="close-btn" (click)="closeModal()" aria-label="Fechar">
                <span>&times;</span>
            </button>
            
            <div class="modal-content">
                <div class="product-image-container" 
                     (mousemove)="onImageMouseMove($event)"
                     (mouseleave)="onImageMouseLeave()">
                    <div class="image-wrapper">
                        <img [src]="profilesService.selectedProduct()?.images?.[1] || profilesService.selectedProduct()?.images?.[0]"
                             [alt]="profilesService.selectedProduct()?.name"
                             class="product-image"
                             [class.zoomed]="showZoomLens"
                             [style.transform]="showZoomLens ? 'scale(' + zoomScale + ')' : 'none'"
                             [style.transform-origin]="showZoomLens ? zoomOrigin : 'center center'" />
                    </div>
                </div>
                
                <div class="product-info">
                    <h3 class="product-title">{{ profilesService.selectedProduct()?.name }}</h3>
                    
                    <div class="product-details">
                        <div class="detail-item">
                            <small>Descrição</small>
                            <p>{{ profilesService.selectedProduct()?.description || '-' }}</p>
                        </div>

                        <div class="detail-row">
                            <div class="detail-item">
                                <small>Peso</small>
                                <p>{{ profilesService.selectedProduct()?.weight || '-' }}</p>
                            </div>
                            <div class="detail-item">
                                <small>Equivalência</small>
                                <p>{{ profilesService.selectedProduct()?.equivalence || '-' }}</p>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button (click)="openImage(profilesService.selectedProduct()?.['tableImageSrc'])" 
                                [style]="profilesService.selectedProduct()?.['isTable'] ? 'visibility:visible' : 'visibility:hidden'"  
                                class="btn btn-primary btn-sm">
                            Ver tabela
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <router-outlet />
    <app-footer />
</div>
